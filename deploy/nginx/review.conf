# CloudPanel: create a site for review.<domain>, issue the Let's Encrypt
# certificate in the panel, then REPLACE the site vhost's location block
# with this one. The app is loopback-only; nginx terminates TLS.

location / {
    proxy_pass http://127.0.0.1:8091;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120;

    # Optional office-IP allowlist (defense-in-depth on top of the token):
    # allow 203.0.113.0/24;   # office range
    # allow 198.51.100.7;     # VPN exit
    # deny  all;
}
